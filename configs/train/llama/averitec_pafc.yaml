### PA-FC — AVeriTeC, Llama-3.1-8B-Instruct
### Primary results configuration. Hyperparameters are per-dataset (see
### docs/PIPELINE.md); they are NOT shared across datasets.
###
### Run once per seed in {42, 191, 999} and average: edit `seed` and `output_dir`,
### or override on the command line.

### model
model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
quantization_bit: 4
quantization_method: bitsandbytes
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset
### Register this name in LLaMA-Factory's data/dataset_info.json, pointing at the
### SFT file produced by scripts/run_pipeline.sh.
dataset: pafc_averitec_train
template: llama3
cutoff_len: 4096
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: saves/pafc/averitec_llama_seed42
logging_steps: 10
save_steps: 200
plot_loss: false
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
seed: 42
val_size: 0.0
