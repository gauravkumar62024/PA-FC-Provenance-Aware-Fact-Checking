# Reproducible environment for PA-FC (training/inference side, ISL-verified).
# Feature generation additionally requires tldextract==5.3.1; see requirements.txt.
name: pafc
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11.4
  - pip
  - pip:
      - torch==2.12.0
      - transformers==5.6.0
      - peft==0.18.1
      - bitsandbytes==0.49.2
      - accelerate==1.11.0
      - datasets==4.0.0
      - trl==0.24.0
      - sentence-transformers==3.0.1
      - tldextract==5.3.1
      - PyYAML==6.0
      - pandas==2.0.3
      - tqdm==4.66.1
      - requests==2.31.0
      - scikit-learn==1.3.0
      - numpy==1.24.3
      - scipy==1.10.1
# Verified on: NVIDIA A100 80GB PCIe, driver 580.173.02, CUDA 13.0,
#              Linux 6.8.0-124, glibc 2.35
